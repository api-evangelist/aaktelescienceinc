aid: aaktelescienceinc
name: AAK Tele-Science, Inc.
description: 'AAK Tele-Science, Inc. (aakscience.com) is a Davis, California software
  company founded in 2020 that operates a cloud-based collaborative platform for the
  global scientific research community. The AAK platform connects researchers, institutions,
  service providers, venture capitalists and investors around shared research projects,
  layering machine-learning-assisted discovery, predictive analytics and a data-fragmentation
  privacy protocol over a subscription SaaS product. The platform is delivered as a
  React single-page application backed by a Django REST API at django.aakscience.com;
  that API is real but is not publicly documented — its drf-yasg schema endpoints require
  HTTP authentication and the production API host answers 401 to every path, so no
  machine-readable contract is reachable without credentials.'
