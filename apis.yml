apis:
- name: AAK Tele-Science API
  description: 'The private Django REST API that backs the AAK Tele-Science platform.
    The application frontend at aakscience.com preconnects to django.aakscience.com,
    and the company runs a drf-yasg (Swagger) schema on the same codebase, but every
    path on the production host — including paths that do not exist — returns HTTP
    401 with an empty body, and the schema endpoints answer "Swagger authentication
    required". No public reference, no published OpenAPI, and no developer portal
    were found.'
